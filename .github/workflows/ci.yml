name: Frontend CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build application
        env:
          NEXT_PUBLIC_API_URL: https://ci-placeholder.invalid
        run: npm run build

      - name: Build container
        env:
          NEXT_PUBLIC_API_URL: https://ci-placeholder.invalid
        run: docker build --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" --tag crm-piposmart-frontend:ci .
