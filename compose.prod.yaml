version: "2.4"

services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      HOSTNAME: 0.0.0.0
      PORT: ${PORT:-3000}
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik-network}
      traefik.http.routers.crm-frontend.rule: Host(`${FRONTEND_DOMAIN}`)
      traefik.http.routers.crm-frontend.entrypoints: ${TRAEFIK_ENTRYPOINTS:-websecure}
      traefik.http.routers.crm-frontend.tls: "true"
      traefik.http.routers.crm-frontend.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.routers.crm-frontend.service: crm-frontend
      traefik.http.services.crm-frontend.loadbalancer.server.port: "3000"

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik-network}
